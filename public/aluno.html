<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz do Aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="tela-registro">
            <h2>Digite seu nome para começar:</h2>
            <input type="text" id="input-nome" placeholder="Seu nome...">
            <button onclick="iniciarJogo()">Entrar no Jogo</button>
        </div>

        <div id="tela-jogo" style="display: none;">
            <h2 id="titulo-pergunta">Aguardando o professor iniciar o quiz...</h2>
            <div id="area-resposta" style="display: none;">
                <textarea id="input-resposta" placeholder="Digite sua resposta aqui..."></textarea>
                <button id="btn-enviar" onclick="enviarResposta()">Enviar Resposta</button>
            </div>
            <div id="status-envio"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let nomeAluno = "";
        let perguntaAtual = "";

        function iniciarJogo() {
            nomeAluno = document.getElementById('input-nome').value.trim();
            if (!nomeAluno) return alert("Por favor, digite seu nome!");

            document.getElementById('tela-registro').style.display = 'none';
            document.getElementById('tela-jogo').style.display = 'block';

            // Avisa o servidor que este aluno entrou para receber a pergunta caso o jogo já tenha começado
            socket.emit('aluno_entrou');
        }

        // Quando o professor dispara o início do jogo
        socket.on('jogo_iniciado', (dados) => {
            perguntaAtual = dados.primeiraPergunta;
            document.getElementById('titulo-pergunta').innerText = perguntaAtual;
            document.getElementById('input-resposta').value = "";
            document.getElementById('status-envio').innerText = "";
            document.getElementById('area-resposta').style.display = 'block';
        });

        // Caso o aluno entre no meio de um jogo que já está rolando
        socket.on('receber_pergunta_aluno', (dados) => {
            perguntaAtual = dados.pergunta;
            document.getElementById('titulo-pergunta').innerText = perguntaAtual;
            document.getElementById('area-resposta').style.display = 'block';
        });

        function enviarResposta() {
            const resposta = document.getElementById('input-resposta').value.trim();
            if (!resposta) return alert("Escreva uma resposta antes de enviar!");

            socket.emit('enviar_resposta', {
                nome: nomeAluno,
                resposta: resposta
            });

            document.getElementById('status-envio').innerHTML = "<p class='aguardando'>Resposta enviada! Aguardando correção do professor...</p>";
            document.getElementById('area-resposta').style.display = 'none';
        }

        socket.on('resultado_avaliacao', (dados) => {
            if (dados.aprovado) {
                if (dados.fim) {
                    alert("Parabéns! Você respondeu todas as perguntas propostas pelo professor!");
                    document.getElementById('titulo-pergunta').innerText = "Você concluiu o Quiz! 🎉";
                    document.getElementById('status-envio').innerText = "";
                    document.getElementById('area-resposta').style.display = 'none';
                } else {
                    alert("Sua resposta foi aprovada! Avançando para a próxima pergunta.");
                    perguntaAtual = dados.proximaPergunta;
                    document.getElementById('titulo-pergunta').innerText = perguntaAtual;
                    document.getElementById('input-resposta').value = "";
                    document.getElementById('status-envio').innerText = "";
                    document.getElementById('area-resposta').style.display = 'block';
                }
            } else {
                alert("Sua resposta foi rejeitada. Tente elaborar outra resposta!");
                document.getElementById('area-resposta').style.display = 'block';
                document.getElementById('status-envio').innerText = "";
            }
        });
    </script>
</body>
</html>
