<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz do Aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="tela-registro">
            <h2>Digite seu nome de exibição:</h2>
            <input type="text" id="input-nome" placeholder="Seu nome...">
            <button onclick="iniciarJogo()">Entrar no Jogo</button>
        </div>

        <div id="tela-jogo" style="display: none;">
            <h2 id="titulo-pergunta">Aguardando o professor iniciar o quiz...</h2>
            <div id="area-resposta" style="display: none;">
                <textarea id="input-resposta" placeholder="Digite sua resposta aqui..."></textarea>
                <button id="btn-enviar" onclick="enviarResposta()">Enviar Resposta</button>
            </div>
            <div id="status-envio"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkcjh3zLMA0kPLrzHYSUDlNVu92iXYrtA",
            authDomain: "quiz-escola-61ff5.firebaseapp.com",
            projectId: "quiz-escola-61ff5",
            storageBucket: "quiz-escola-61ff5.firebasestorage.app",
            messagingSenderId: "519577877230",
            appId: "1:519577877230:web:7a43984e418527847dd1ff"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const socket = io();

        let nomeAluno = "";
        let emailAluno = "";
        let perguntaAtual = "";

        // Identifica quem está logado no Firebase
        auth.onAuthStateChanged((user) => {
            if (user) {
                emailAluno = user.email;
            }
        });

        function iniciarJogo() {
            nomeAluno = document.getElementById('input-nome').value.trim();
            if (!nomeAluno) return alert("Por favor, digite seu nome!");

            document.getElementById('tela-registro').style.display = 'none';
            document.getElementById('tela-jogo').style.display = 'block';

            // Registra a presença no painel do professor
            socket.emit('aluno_logou', { 
                nome: nomeAluno, 
                email: emailAluno || nomeAluno 
            });
            
            socket.emit('aluno_entrou');
        }

        socket.on('jogo_iniciado', (dados) => {
            perguntaAtual = dados.primeiraPergunta;
            document.getElementById('titulo-pergunta').innerText = perguntaAtual;
            document.getElementById('input-resposta').value = "";
            document.getElementById('status-envio').innerText = "";
            document.getElementById('area-resposta').style.display = 'block';
        });

        socket.on('receber_pergunta_aluno', (dados) => {
            perguntaAtual = dados.pergunta;
            document.getElementById('titulo-pergunta').innerText = perguntaAtual;
            document.getElementById('area-resposta').style.display = 'block';
        });

        function enviarResposta() {
            const resposta = document.getElementById('input-resposta').value.trim();
            if (!resposta) return alert("Escreva uma resposta antes de enviar!");

            socket.emit('enviar_resposta', { nome: nomeAluno, resposta: resposta });
            document.getElementById('status-envio').innerHTML = "<p class='aguardando'>Resposta enviada! Aguardando correção...</p>";
            document.getElementById('area-resposta').style.display = 'none';
        }

        socket.on('resultado_avaliacao', (dados) => {
            if (dados.aprovado) {
                if (dados.fim) {
                    alert("Parabéns! Você respondeu todas as perguntas!");
                    document.getElementById('titulo-pergunta').innerText = "Você concluiu o Quiz! 🎉";
                    document.getElementById('status-envio').innerText = "";
                    document.getElementById('area-resposta').style.display = 'none';
                } else {
                    alert("Sua resposta foi aprovada! Próxima pergunta.");
                    perguntaAtual = dados.proximaPergunta;
                    document.getElementById('titulo-pergunta').innerText = perguntaAtual;
                    document.getElementById('input-resposta').value = "";
                    document.getElementById('status-envio').innerText = "";
                    document.getElementById('area-resposta').style.display = 'block';
                }
            } else {
                alert("Sua resposta foi rejeitada. Tente novamente!");
                document.getElementById('area-resposta').style.display = 'block';
                document.getElementById('status-envio').innerText = "";
            }
        });
    </script>
</body>
</html>
